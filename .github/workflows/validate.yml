name: synthetic-workflow-checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Check public-files allowlist
        run: python3 scripts/check_publication.py
      - name: Test base R coverage workflow on synthetic data
        run: Rscript tests/test_coverage.R
