name: ssgsea-synthetic-manual

# On-demand integration check. The automatic coverage workflow is unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssgsea-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # Use the Bioconductor 3.18 mirror verified on the local R 4.3.3 setup.
      # pkgcache/pak supports both environment variables.
      R_BIOC_VERSION: '3.18'
      R_BIOC_MIRROR: 'https://bioconductor.uib.no'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # No DESCRIPTION file: this is a script repository, not an R package.
          # Suppress the default 'deps::., any::sessioninfo'.
          packages: ''
          extra-packages: |
            bioc::DESeq2
            bioc::GSVA
          dependencies: '"hard"'
      - name: Verify installed package versions
        shell: Rscript {0}
        run: |
          cat('R:', as.character(getRversion()), '\n')
          cat('DESeq2:', as.character(packageVersion('DESeq2')), '\n')
          cat('GSVA:', as.character(packageVersion('GSVA')), '\n')
      - name: Synthetic ssGSEA integration test
        run: Rscript tests/test_ssgsea.R
      - name: Verify publication safety of tracked files
        run: python3 scripts/check_publication.py
